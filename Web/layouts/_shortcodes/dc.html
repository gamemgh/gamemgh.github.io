{{- $id := .Get "id" -}}
{{- $file := .Get "file" -}}
<script>
const {{ $id | safeJS }} = document.getElementById("{{ $id | safeJS }}");
if ({{ $id | safeJS }}) {
	get_gh_asset_info("gamemgh", "gamemgh.github.io", "{{ $file }}").then(t => {
		{{ $id | safeJS }}.textContent = `${t.download_count} downloads`;
		totaldownload += t.download_count;
		document.getElementById("totaldownload").textContent = `Total downloads: ${totaldownload}`;
	});
}
</script>
